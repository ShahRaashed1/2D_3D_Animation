<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CSS Transforms and Animations</title>

<style>
    body {
        font-family: Arial, sans-serif;
        text-align: center;
        background: #f4f4f4;
        padding: 20px;
    }

    h1 {
        color: #333;
    }

    .container {
        display: flex;
        flex-wrap: wrap;
        justify-content: center;
        gap: 20px;
        margin: 30px 0;
    }

    .box {
        width: 150px;
        height: 150px;
        display: flex;
        justify-content: center;
        align-items: center;
        color: white;
        font-weight: bold;
        border-radius: 10px;
        cursor: pointer;
        transition: transform 0.6s ease;
    }

    /* ID Selector */
    #rotateBox {
        background: #e74c3c;
    }
    #rotateBox:hover {
        transform: rotate(45deg);
    }

    /* Attribute Selector */
    div[data-type="scale"] {
        background: #3498db;
    }
    div[data-type="scale"]:hover {
        transform: scale(1.3);
    }

    /* Class Selector */
    .translate {
        background: #2ecc71;
    }
    .translate:hover {
        transform: translateY(-25px);
    }

    /* Skew Transform */
    .skew {
        background: #9b59b6;
    }
    .skew:hover {
        transform: skew(20deg, 10deg);
    }

    /* 3D Transform Container */
    .perspective {
        perspective: 800px;
    }

    .rotate3d {
        background: #f39c12;
    }
    .rotate3d:hover {
        transform: rotateY(180deg);
    }

    .flip3d {
        background: #1abc9c;
    }
    .flip3d:hover {
        transform: rotateX(180deg);
    }

    .depth3d {
        background: #34495e;
    }
    .depth3d:hover {
        transform: translateZ(100px) scale(1.2);
    }

    /* Animation */
    .animated {
        width: 100px;
        height: 100px;
        background: orange;
        border-radius: 50%;
        margin: 40px auto;
        animation: bounce 2s infinite;
    }

    @keyframes bounce {
        0% { transform: translateY(0); }
        50% { transform: translateY(-50px); }
        100% { transform: translateY(0); }
    }
</style>
</head>
<body>

<h1>CSS Identifiers, Animations & 2D/3D Transforms</h1>

<div class="container">
    <div id="rotateBox" class="box">Rotate</div>
    <div class="box" data-type="scale">Scale</div>
    <div class="box translate">Translate</div>
    <div class="box skew">Skew</div>
</div>

<h2>3D Transforms</h2>

<div class="container perspective">
    <div class="box rotate3d">RotateY</div>
    <div class="box flip3d">RotateX</div>
    <div class="box depth3d">TranslateZ</div>
</div>

<h2>Animation</h2>
<div class="animated"></div>

<?php
echo "Welcome to the CSS Transforms and Animations Demo!";
?>

</body>
</html>
